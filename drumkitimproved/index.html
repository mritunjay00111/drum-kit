<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drum kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="soundBox" data-key="a">A <p>boom</p></div>
        <div class="soundBox" data-key="s">S <p>clap</p></div>
        <div class="soundBox" data-key="d">D <p>hihat</p></div>
        <div class="soundBox" data-key="f">F <p>kick</p></div>
        <div class="soundBox" data-key="g">G <p>openhat</p></div>
        <div class="soundBox" data-key="h">H <p>ride</p></div>
        <div class="soundBox" data-key="j">J <p>snare</p></div>
        <div class="soundBox" data-key="k">K <p>tink</p></div>
        <div class="soundBox" data-key="l">L <p>tom</p></div>
    </div>
    <audio src="./sounds/boom.wav" data-key="a"></audio>
    <audio src="./sounds/clap.wav" data-key="s"></audio>
    <audio src="./sounds/hihat.wav" data-key="d"></audio>
    <audio src="./sounds/kick.wav" data-key="f"></audio>
    <audio src="./sounds/openhat.wav" data-key="g"></audio>
    <audio src="./sounds/ride.wav" data-key="h"></audio>
    <audio src="./sounds/snare.wav" data-key="j"></audio>
    <audio src="./sounds/tink.wav" data-key="k"></audio>
    <audio src="./sounds/tom.wav" data-key="l"></audio>
    <script src="script.js"></script>
</body>
</html>
